[build-system]
requires = ["setuptools>=69", "grpcio-tools>=1.85"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "rf-device-platform"
version = "0.1.1"
description = "Capability-based host platform for RF devices"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=7.35.1,<8",
    "Pillow>=10,<13",
    "lzokay>=2.1,<3",
    "python-multipart>=0.0.20,<1",
]

[project.scripts]
rf-device = "rf_platform.__main__:main"
rf-device-web = "rf_platform.web_app:main"
rf-device-display = "rf_platform.display.cli:main"

[project.optional-dependencies]
ble = ["bleak>=0.22"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["grpcio-tools>=1.85"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rf_platform*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
rf_platform = ["web/*.html"]
