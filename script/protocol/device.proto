syntax = "proto3";

package rfplatform.v1;

option java_multiple_files = true;

// Every transport carries one serialized Envelope per logical message.
message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  fixed64 session_id = 3;
  fixed32 request_id = 4;

  oneof body {
    HelloRequest hello_request = 10;
    HelloResponse hello_response = 11;
    CapabilityQuery capability_query = 12;
    CapabilityList capability_list = 13;
    StartJob start_job = 14;
    CancelJob cancel_job = 15;
    QueryJob query_job = 16;
    JobEvent job_event = 17;
    TransferBegin transfer_begin = 18;
    TransferChunk transfer_chunk = 19;
    TransferAck transfer_ack = 20;
    TransferFinish transfer_finish = 21;
  }
}

message HelloRequest {
  uint32 min_protocol_major = 1;
  uint32 max_protocol_major = 2;
  uint32 max_protocol_minor = 3;
  bytes host_nonce = 4;
}

message HelloResponse {
  bytes device_id = 1;
  bytes boot_id = 2;
  uint32 protocol_major = 3;
  uint32 protocol_minor = 4;
  uint32 max_control_message = 5;
  uint32 max_data_chunk = 6;
  uint32 max_in_flight_jobs = 7;
  repeated string transport = 8;
}

message CapabilityQuery {}

message CapabilityList {
  repeated CapabilityDescriptor capabilities = 1;
}

message CapabilityDescriptor {
  string id = 1;
  uint32 major_version = 2;
  uint32 minor_version = 3;
  repeated OperationDescriptor operations = 4;
  repeated CapabilityRequirement requirements = 5;
}

message OperationDescriptor {
  string id = 1;
  bool mutating = 2;
  bool cancellable = 3;
  uint32 max_payload_size = 4;
  bool requires_target_confirmation = 5;
}

message CapabilityRequirement {
  string id = 1;
  uint32 minimum_major = 2;
}

message StartJob {
  string capability_id = 1;
  uint32 capability_major = 2;
  string operation_id = 3;
  bytes arguments = 4;
  uint32 deadline_ms = 5;
  bytes idempotency_key = 6;
  bool user_confirmed = 7;
  bytes confirmed_target_uid = 8;
}

message CancelJob {
  fixed32 job_id = 1;
}

message QueryJob {
  fixed32 job_id = 1;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_ACCEPTED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_COMPLETED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
  JOB_STATE_RESULT_UNCERTAIN = 6;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_BUSY = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_TIMEOUT = 5;
  ERROR_CODE_TRANSPORT = 6;
  ERROR_CODE_RF = 7;
  ERROR_CODE_PROTOCOL = 8;
  ERROR_CODE_CANCELLED = 9;
  ERROR_CODE_RESULT_UNCERTAIN = 10;
}

message JobEvent {
  fixed32 job_id = 1;
  JobState state = 2;
  string stage = 3;
  uint32 progress_current = 4;
  uint32 progress_total = 5;
  ErrorCode error_code = 6;
  string detail = 7;
  bytes result = 8;
}

message DeviceInfoResult {
  bytes device_id = 1;
  bytes boot_id = 2;
  string firmware_name = 3;
  string firmware_version = 4;
  string radio_controller = 5;
  bytes bluetooth_mac = 6;
}

message TxAmplitudeRequest {
  optional uint32 level = 1;
}

message TxAmplitudeResult {
  uint32 level = 1;
}

message RfFieldRequest {
  bool enabled = 1;
}

// IDs match the CLRC663 datasheet's LoadProtocol RX table (Table 47).
enum RfRxMode {
  RF_RX_MODE_ISO14443A_106 = 0;
  RF_RX_MODE_ISO14443A_212 = 1;
  RF_RX_MODE_ISO14443A_424 = 2;
  RF_RX_MODE_ISO14443A_848 = 3;
  RF_RX_MODE_ISO14443B_106 = 4;
  RF_RX_MODE_ISO14443B_212 = 5;
  RF_RX_MODE_ISO14443B_424 = 6;
  RF_RX_MODE_ISO14443B_848 = 7;
  RF_RX_MODE_FELICA_212 = 8;
  RF_RX_MODE_FELICA_424 = 9;
  RF_RX_MODE_ISO15693_26_SSC = 10;
  RF_RX_MODE_ISO15693_52_SSC = 11;
  RF_RX_MODE_ISO15693_26_DSC = 12;
  RF_RX_MODE_EPC_UID_26_SSC = 13;
  RF_RX_MODE_ISO18000_3_EPC_V2_2_424 = 14;
  RF_RX_MODE_ISO18000_3_EPC_V2_4_424 = 15;
  RF_RX_MODE_ISO18000_3_EPC_V2_2_848 = 16;
  RF_RX_MODE_ISO18000_3_EPC_V2_4_848 = 17;
  RF_RX_MODE_JEWEL = 18;
}

// IDs match the CLRC663 datasheet's LoadProtocol TX table (Table 48).
enum RfTxMode {
  RF_TX_MODE_ISO14443A_106 = 0;
  RF_TX_MODE_ISO14443A_212 = 1;
  RF_TX_MODE_ISO14443A_424 = 2;
  RF_TX_MODE_ISO14443A_848 = 3;
  RF_TX_MODE_ISO14443B_106 = 4;
  RF_TX_MODE_ISO14443B_212 = 5;
  RF_TX_MODE_ISO14443B_424 = 6;
  RF_TX_MODE_ISO14443B_848 = 7;
  RF_TX_MODE_FELICA_212 = 8;
  RF_TX_MODE_FELICA_424 = 9;
  RF_TX_MODE_ISO15693_1_OF_4_26_ID_10 = 10;
  RF_TX_MODE_ISO15693_1_OF_4_26_ID_11 = 11;
  RF_TX_MODE_ISO15693_1_OF_256_1_66_KBIT = 12;
  RF_TX_MODE_EPC_UID_53_UNITRAY = 13;
  RF_TX_MODE_ISO18000_3_EPC_V2_2_424 = 14;
  RF_TX_MODE_ISO18000_3_EPC_V2_4_424 = 15;
  RF_TX_MODE_ISO18000_3_EPC_V2_2_848 = 16;
  RF_TX_MODE_ISO18000_3_EPC_V2_4_848 = 17;
  RF_TX_MODE_JEWEL = 18;
}

message RawRfTransceiveRequest {
  bytes tx = 1;
  uint32 timeout_ms = 2;
  uint32 tx_last_bits = 3;
  uint32 rx_align = 4;
  uint32 crc_flags = 5;
  RfRxMode rx_mode = 6;
  optional RfTxMode tx_mode = 7;
}

message RawRfTransceiveResult {
  bytes rx = 1;
  uint32 rx_last_bits = 2;
  uint32 irq0 = 3;
  uint32 irq1 = 4;
  uint32 error = 5;
  uint32 collision = 6;
}

message Clrc663CommandRequest {
  uint32 command = 1;
  bytes fifo_input = 2;
  uint32 timeout_ms = 3;
}

message Clrc663CommandResult {
  bytes fifo_output = 1;
  uint32 irq0 = 2;
  uint32 irq1 = 3;
  uint32 error = 4;
  uint32 status = 5;
}

message Clrc663RegisterRequest {
  uint32 address = 1;
  uint32 value = 2;
}

message Clrc663RegisterResult {
  uint32 value = 1;
}

message TransferBegin {
  fixed32 transfer_id = 1;
  uint64 total_size = 2;
  bytes sha256 = 3;
  string purpose = 4;
}

message TransferChunk {
  fixed32 transfer_id = 1;
  uint64 offset = 2;
  fixed32 sequence = 3;
  fixed32 crc32 = 4;
  bytes data = 5;
}

message TransferAck {
  fixed32 transfer_id = 1;
  uint64 next_offset = 2;
  uint32 receive_window = 3;
  ErrorCode error_code = 4;
}

message TransferFinish {
  fixed32 transfer_id = 1;
}

// Purpose "firmware" is written to the inactive OTA slot and selected only
// after the complete image passes SHA-256 validation.
